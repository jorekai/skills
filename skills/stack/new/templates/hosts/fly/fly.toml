# The app configuration for {{NAME}} on the third target. Jobs run as scheduled machines the
# jobs port declares; this file describes the web machine alone.
app = "{{NAME}}"
primary_region = "ams"

[build]

[env]
PORT = "3000"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/api/health"
