# The local dependency stack: the same three servers on every target, so a wired adapter can be
# tried against a real endpoint without an account. Nothing here is used by the unit tests, which
# run on the memory adapters. The app itself runs on the host, not in a container, and a container
# that needs the tree mounts it under /srv/app.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: app-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage:/data
  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres:
  storage:
