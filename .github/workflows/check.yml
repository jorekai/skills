name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Customer patterns from the repository secret
        env:
          CHECK_PUBLIC_LOCAL: ${{ secrets.CHECK_PUBLIC_LOCAL }}
        run: printf '%s\n' "$CHECK_PUBLIC_LOCAL" > .check_public.local
      # A fork's pull request receives no secret, so the customer-name check cannot run there and
      # says so. Everywhere else an empty file means the secret is gone, and check.sh would print
      # ok with that check silently skipped, which is worse than no check.
      - name: The customer-name check has patterns to run on
        if: github.event.pull_request.head.repo.fork != true
        run: |
          test -n "$(tr -d '[:space:]' < .check_public.local)" || {
            echo "::error::CHECK_PUBLIC_LOCAL is empty, so the customer-name check would pass blind"
            exit 1
          }
      - run: bash scripts/check.sh
  secrets:
    runs-on: ubuntu-latest
    # The scanner calls the pull request review comment API when it finds something, and its
    # comments are on by default, so this job needs more than the read-only default above.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
